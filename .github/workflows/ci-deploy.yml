name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: globortunity_test
          POSTGRES_USER: globortunity
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globortunity -d globortunity_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://globortunity:integration-test-only@127.0.0.1:5432/globortunity_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://globortunity:integration-test-only@127.0.0.1:5432/globortunity_test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build release images
        env:
          DEPLOY_TAG: ${{ github.sha }}
        run: |
          docker buildx build --load --target api --tag "globortunity-api:${DEPLOY_TAG}" .
          docker buildx build --load --target worker --tag "globortunity-worker:${DEPLOY_TAG}" .
          docker buildx build --load --target web --tag "globortunity-web:${DEPLOY_TAG}" .
          docker pull postgres:16-alpine
          docker save "globortunity-api:${DEPLOY_TAG}" "globortunity-worker:${DEPLOY_TAG}" "globortunity-web:${DEPLOY_TAG}" postgres:16-alpine | gzip -1 > "images-${DEPLOY_TAG}.tar.gz"
          git archive --format=tar.gz --output="release-${DEPLOY_TAG}.tar.gz" "${DEPLOY_TAG}"
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/globortunity
          chmod 600 ~/.ssh/globortunity
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_TAG: ${{ github.sha }}
        run: |
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-i "$HOME/.ssh/globortunity" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15)
          scp "${ssh_args[@]}" "images-${DEPLOY_TAG}.tar.gz" "release-${DEPLOY_TAG}.tar.gz" "${remote}:/tmp/"
          ssh "${ssh_args[@]}" "$remote" "set -eu; release=/opt/globortunity/releases/${DEPLOY_TAG}; install -d \"\$release\"; tar -xzf /tmp/release-${DEPLOY_TAG}.tar.gz -C \"\$release\"; mv /tmp/images-${DEPLOY_TAG}.tar.gz \"\$release/images.tar.gz\"; cd \"\$release\"; DEPLOY_TAG=${DEPLOY_TAG} sh infra/remote-deploy.sh \"\$release/images.tar.gz\"; rm -f /tmp/release-${DEPLOY_TAG}.tar.gz"
