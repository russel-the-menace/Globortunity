name: globortunity

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globortunity}
      POSTGRES_USER: ${POSTGRES_USER:-globortunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 160m
    cpus: 0.5
    logging: *default-logging

  migrate:
    image: globortunity-api:${DEPLOY_TAG:-dev}
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    command: ["node", "packages/database/dist/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_SIZE: 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging

  seed:
    image: globortunity-api:${DEPLOY_TAG:-dev}
    command: ["node", "packages/database/dist/seed.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_SIZE: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging

  api:
    image: globortunity-api:${DEPLOY_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=88
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_SIZE: 5
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      seed:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/ready"]
      interval: 15s
      timeout: 4s
      retries: 6
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging

  worker:
    image: globortunity-worker:${DEPLOY_TAG:-dev}
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=64
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_SIZE: 3
      DEMO_SOURCE_ENABLED: ${DEMO_SOURCE_ENABLED:-true}
      COLLECTOR_INTERVAL_MS: ${COLLECTOR_INTERVAL_MS:-900000}
      CRAWLING_ENABLED: ${CRAWLING_ENABLED:-false}
      BOSS_SOURCE_ENABLED: ${BOSS_SOURCE_ENABLED:-false}
      BOSS_AUTHORIZED_ACCESS: ${BOSS_AUTHORIZED_ACCESS:-false}
      BOSS_REQUESTS_PER_MINUTE: ${BOSS_REQUESTS_PER_MINUTE:-6}
      BOSS_DAILY_REQUEST_BUDGET: ${BOSS_DAILY_REQUEST_BUDGET:-500}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,api,web,worker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seed:
        condition: service_completed_successfully
    mem_limit: 96m
    cpus: 0.35
    logging: *default-logging

  web:
    image: globortunity-web:${DEPLOY_TAG:-dev}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    mem_limit: 48m
    cpus: 0.25
    logging: *default-logging

volumes:
  postgres_data:
